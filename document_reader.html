<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文档阅读器</title>
  <style>
    :root {
      --canvas: #f4f1ec;
      --paper: #fffdf8;
      --ink: #22201c;
      --muted: #767066;
      --line: #ded7cb;
      --soft: #ebe4d8;
      --accent: #315c62;
      --accent-strong: #173f45;
      --amber: #b87b2b;
      --shadow: 0 24px 70px rgba(44, 38, 30, .12);
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      --serif: "Georgia", "Times New Roman", "Songti SC", serif;
      --sans: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(49, 92, 98, .08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(49, 92, 98, .06) 1px, transparent 1px),
        var(--canvas);
      background-size: 42px 42px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr);
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      background: rgba(255, 253, 248, .88);
      border-bottom: 1px solid rgba(222, 215, 203, .9);
      backdrop-filter: blur(18px);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .brand-name {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .file-title {
      min-width: 0;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink);
      padding: 0 10px;
      font: inherit;
      font-weight: 700;
    }

    .file-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fffaf0;
      color: var(--accent-strong);
      padding: 0 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .file-picker input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover,
    .file-picker:hover,
    select:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
      box-shadow: 0 6px 20px rgba(49, 92, 98, .12);
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: 304px minmax(0, 1fr);
      gap: 0;
    }

    aside {
      height: calc(100vh - 64px);
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgba(255, 253, 248, .72);
      border-right: 1px solid rgba(222, 215, 203, .95);
      backdrop-filter: blur(12px);
      padding: 22px 14px 26px;
    }

    .toc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 0 8px;
    }

    .toc-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .toc-count {
      color: var(--amber);
      font-size: 12px;
      font-weight: 800;
    }

    .toc {
      display: grid;
      gap: 3px;
    }

    .toc a {
      position: relative;
      display: block;
      color: #554f46;
      text-decoration: none;
      border-radius: 7px;
      padding: 8px 10px 8px 14px;
      line-height: 1.35;
      word-break: break-word;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .toc a:hover {
      background: rgba(49, 92, 98, .08);
      color: var(--accent-strong);
    }

    .toc a.active {
      background: #dfe9e7;
      color: var(--accent-strong);
      font-weight: 800;
      transform: translateX(2px);
    }

    .toc a.active::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 3px;
      background: var(--accent);
    }

    .toc .h2 { padding-left: 26px; font-size: 14px; }
    .toc .h3 { padding-left: 42px; font-size: 13px; color: var(--muted); }

    article {
      height: calc(100vh - 64px);
      min-width: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 34px min(7vw, 76px) 72px;
      scroll-behavior: smooth;
    }

    .doc {
      max-width: 980px;
      margin: 0 auto;
      background: rgba(255, 253, 248, .94);
      border: 1px solid rgba(222, 215, 203, .95);
      border-radius: 8px;
      padding: 42px 52px;
      box-shadow: var(--shadow);
    }

    .empty {
      min-height: 430px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,250,240,.72));
      padding: 24px;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 28px;
      margin-bottom: 8px;
    }

    h1, h2, h3, h4 {
      color: var(--ink);
      line-height: 1.32;
      letter-spacing: 0;
      scroll-margin-top: 28px;
    }

    h1 {
      font-family: var(--serif);
      font-size: 36px;
      margin: 0 0 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      font-size: 24px;
      margin: 34px 0 12px;
      padding-top: 4px;
    }

    h3 {
      font-size: 18px;
      margin: 26px 0 10px;
      color: var(--accent-strong);
    }

    h4 {
      font-size: 16px;
      margin: 22px 0 8px;
    }

    p, li {
      line-height: 1.82;
    }

    p {
      margin: 12px 0;
    }

    ul {
      padding-left: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      display: block;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 9px 11px;
      text-align: left;
      vertical-align: top;
      min-width: 120px;
    }

    th {
      background: #eee7dc;
      color: #3a352e;
      font-weight: 800;
    }

    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }

    code {
      background: #efe8dc;
      border: 1px solid #e2d8c9;
      border-radius: 5px;
      padding: 2px 5px;
      font-family: var(--mono);
      font-size: .92em;
    }

    pre {
      background: #252a2b;
      color: #f5efe4;
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    pre code {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
    }

    blockquote {
      margin: 18px 0;
      padding: 10px 18px;
      border-left: 4px solid var(--accent);
      background: #edf3f1;
      color: #4e5c5d;
      border-radius: 0 7px 7px 0;
    }

    a { color: var(--accent-strong); }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      header {
        grid-template-columns: 1fr;
        min-height: 64px;
        height: auto;
        padding: 12px 14px;
      }
      .brand { display: grid; gap: 2px; }
      .toolbar { flex-wrap: wrap; }
      main { grid-template-columns: 1fr; }
      aside {
        height: 220px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      article {
        height: auto;
        min-height: calc(100vh - 284px);
        overflow: visible;
        padding: 18px;
      }
      .doc { padding: 26px 18px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-name">文档阅读器</div>
        <div class="file-title" id="pageTitle">打开 Markdown 文件开始阅读</div>
      </div>
      <div class="toolbar">
        <select id="encodingSelect" aria-label="文档编码">
          <option value="auto">自动识别编码</option>
          <option value="utf-8">UTF-8</option>
          <option value="gb18030">GB18030 / GBK</option>
        </select>
        <label class="file-picker">
          打开文件
          <input id="fileInput" type="file" accept=".md,.markdown,text/markdown,text/plain" />
        </label>
        <button id="reloadButton" type="button">重新加载</button>
      </div>
    </header>
    <main>
      <aside id="sidebar">
        <div class="toc-head">
          <p class="toc-title">Contents</p>
          <span class="toc-count" id="tocCount">0</span>
        </div>
        <nav class="toc" id="toc"></nav>
      </aside>
      <article id="reader">
        <div class="doc" id="doc">
          <div class="empty">
            <div>
              <strong>文档阅读器</strong>
              选择一个 Markdown 文件，目录会在左侧生成，正文滚动时自动定位当前章节。
            </div>
          </div>
        </div>
      </article>
    </main>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const encodingSelect = document.getElementById("encodingSelect");
    const reloadButton = document.getElementById("reloadButton");
    const pageTitle = document.getElementById("pageTitle");
    const toc = document.getElementById("toc");
    const tocCount = document.getElementById("tocCount");
    const doc = document.getElementById("doc");
    const reader = document.getElementById("reader");
    const sidebar = document.getElementById("sidebar");
    let currentFile = null;
    let headingsCache = [];

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    }

    function slugify(text, index) {
      return "heading-" + index + "-" + text.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, "-");
    }

    function setActiveToc(id) {
      const links = Array.from(toc.querySelectorAll("a"));
      links.forEach((link) => link.classList.toggle("active", link.dataset.target === id));
      const active = toc.querySelector("a.active");
      if (active) {
        const activeTop = active.offsetTop;
        const activeBottom = activeTop + active.offsetHeight;
        const viewTop = sidebar.scrollTop;
        const viewBottom = viewTop + sidebar.clientHeight;
        if (activeTop < viewTop + 18 || activeBottom > viewBottom - 18) {
          sidebar.scrollTo({ top: Math.max(activeTop - sidebar.clientHeight / 2, 0), behavior: "smooth" });
        }
      }
    }

    function updateActiveByScroll() {
      if (!headingsCache.length) return;
      const readerTop = reader.getBoundingClientRect().top;
      let active = headingsCache[0];
      for (const item of headingsCache) {
        const top = item.element.getBoundingClientRect().top - readerTop;
        if (top <= 96) active = item;
      }
      setActiveToc(active.id);
    }

    function bindTocScroll() {
      headingsCache = Array.from(doc.querySelectorAll("h1, h2, h3")).map((element) => ({
        id: element.id,
        element
      }));
      reader.removeEventListener("scroll", updateActiveByScroll);
      reader.addEventListener("scroll", updateActiveByScroll, { passive: true });
      updateActiveByScroll();
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      const html = [];
      const headings = [];
      let inCode = false;
      let codeLines = [];
      let listOpen = false;
      let tableBuffer = [];

      function closeList() {
        if (listOpen) {
          html.push("</ul>");
          listOpen = false;
        }
      }

      function flushTable() {
        if (!tableBuffer.length) return;
        const rows = tableBuffer.filter((line) => !/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line));
        html.push("<table>");
        rows.forEach((row, rowIndex) => {
          const cells = row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => inlineMarkdown(cell.trim()));
          html.push("<tr>" + cells.map((cell) => rowIndex === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`).join("") + "</tr>");
        });
        html.push("</table>");
        tableBuffer = [];
      }

      lines.forEach((line, index) => {
        if (/^```/.test(line)) {
          flushTable();
          closeList();
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
            codeLines = [];
            inCode = false;
          } else {
            inCode = true;
          }
          return;
        }
        if (inCode) {
          codeLines.push(line);
          return;
        }
        if (/^\|.+\|$/.test(line.trim())) {
          closeList();
          tableBuffer.push(line);
          return;
        }
        flushTable();
        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = slugify(text, index);
          if (level <= 3) headings.push({ level, text, id });
          html.push(`<h${level} id="${id}">${inlineMarkdown(text)}</h${level}>`);
          return;
        }
        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (bullet) {
          if (!listOpen) {
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${inlineMarkdown(bullet[1])}</li>`);
          return;
        }
        closeList();
        if (/^\s*>\s+/.test(line)) {
          html.push(`<blockquote>${inlineMarkdown(line.replace(/^\s*>\s+/, ""))}</blockquote>`);
          return;
        }
        if (line.trim()) {
          html.push(`<p>${inlineMarkdown(line.trim())}</p>`);
        }
      });
      flushTable();
      closeList();
      if (inCode) {
        html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
      }

      doc.innerHTML = html.join("\n") || '<div class="empty"><div><strong>空文档</strong>这个文件没有可显示的内容。</div></div>';
      toc.innerHTML = headings
        .map((item) => `<a class="h${item.level}" href="#${item.id}" data-target="${item.id}">${escapeHtml(item.text)}</a>`)
        .join("");
      tocCount.textContent = String(headings.length);
      const firstTitle = headings[0]?.text || currentFile?.name || "打开 Markdown 文件开始阅读";
      pageTitle.textContent = firstTitle;
      reader.scrollTo({ top: 0 });
      bindTocScroll();
    }

    function decodeBuffer(buffer) {
      const selected = encodingSelect.value;
      if (selected !== "auto") {
        return new TextDecoder(selected).decode(buffer);
      }
      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
      } catch (error) {
        return new TextDecoder("gb18030").decode(buffer);
      }
    }

    function loadCurrentFile() {
      if (!currentFile) return;
      const readerFile = new FileReader();
      readerFile.onload = () => {
        const buffer = readerFile.result;
        if (!(buffer instanceof ArrayBuffer)) return;
        renderMarkdown(decodeBuffer(buffer));
      };
      readerFile.readAsArrayBuffer(currentFile);
    }

    fileInput.addEventListener("change", () => {
      currentFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
      loadCurrentFile();
    });

    reloadButton.addEventListener("click", loadCurrentFile);
    encodingSelect.addEventListener("change", loadCurrentFile);

    toc.addEventListener("click", (event) => {
      const link = event.target.closest("a[data-target]");
      if (!link) return;
      event.preventDefault();
      const target = document.getElementById(link.dataset.target);
      if (!target) return;
      reader.scrollTo({
        top: target.offsetTop - 24,
        behavior: "smooth"
      });
      setActiveToc(link.dataset.target);
    });
  </script>
</body>
</html>
